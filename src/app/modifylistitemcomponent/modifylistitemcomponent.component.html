<form [formGroup]="phoneForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="serialNumber">ID</label>
    <input type="number" id="serialNumber" formControlName="serialNumber" />
  </div>

  <div class="form-group">
    <label for="brand">Brand</label>
    <input type="text" id="brand" formControlName="brand" />
  </div>

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" />
  </div>
  <div class="form-group">
    <label for="color">Color</label>
    <input type="text" id="color" formControlName="color" />
  </div>


  <div class="form-group">
    <label>Software:</label>
    <div>
      <input type="radio" id="ios" formControlName="software" value="iOS" />
      <label for="ios">iOS</label>
    </div>
    <div>
      <input type="radio" id="android" formControlName="software" value="Android" />
      <label for="android">Android</label>
    </div>
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>

</form>
<div *ngIf="error" class="error">{{ error }}</div>
