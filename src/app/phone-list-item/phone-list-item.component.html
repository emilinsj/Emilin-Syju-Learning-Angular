<div *ngIf="phone" class="detail" >
  <h3>Phone Collection</h3>
  <p>Serial Number:{{phone.serialNumber}}</p>
  <p>Name:{{phone.name}}</p>
  <p>Color:{{phone.color}}</p>
  <p>Brand:{{phone.brand}}</p>
  <p>Software:{{phone.software}}</p>
  <p>Image: {{phone.imgPath}}</p>
</div>
<div *ngIf="error" class="error">{{ error }}</div>
