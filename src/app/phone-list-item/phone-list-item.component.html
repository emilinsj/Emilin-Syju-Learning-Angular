<div *ngIf="phone" class="detail"  [appHoverHighlight]="'lightblue'" >
  <h3>Phone Collection</h3>
  <p>Serial Number:{{phone.serialNumber}}</p>
  <p>Name:{{phone.name}}</p>
  <p>Color:{{ phone.color | titlecase}}</p>
  <p>Brand:{{ phone.brand}}</p>
  <p>Budget:{{phone.budget | currency: 'CAD': "symbol-narrow"}}</p>
  <p>Software:{{ phone.software | lowercase}}</p>
  <p>Image: {{phone.imgPath}}</p>
</div>
<div *ngIf="error" class="error">{{ error }}</div>
